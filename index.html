<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Meta Tags -->

    />

    <meta
      name="description"
      content="Monami Jerome — Web Developer & Designer based in Bujumbura, Burundi. Full-stack developer specializing in Angular, Node.js, and PHP."

      content="Monami Jerome, Web Developer, Burundi, Angular, Node.js, PHP, Full Stack, Bujumbura"
    />

    <meta name="robots" content="index, follow" />

    <meta property="og:title" content="Monami Jerome · Web Developer" />

    <meta property="og:locale:alternate" content="sw_TZ" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="ln_CD" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monami Jerome · Web Developer" />
    <meta
      name="twitter:description"
      content="Discover Monami Jerome's projects and skills"
    />
    <meta name="twitter:image" content="images/jer.jpg" />

    <title>Monami Jerome · Web Developer & Designer in Bujumbura</title>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Monami Jerome",
        "url": "https://monamijer.github.io/portfolio",
        "image": "https://monamijer.github.io/portfolio/images/jer.jpg",
        "jobTitle": "Web Developer & Designer",
        "description": "Full-stack oriented web developer based in Bujumbura, Burundi",
        "email": "mailto:monamijer2005@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bujumbura",
          "addressCountry": "BI"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "University of Burundi"
        },
        "knowsAbout": [
          "Web Development",
          "Angular",
          "Node.js",
          "PHP",
          "Python",
          "JavaScript",
          "HTML",
          "CSS",
          "UI/UX Design",
          "REST APIs"
        ],
        "sameAs": [
          "https://github.com/monamijer",
          "https://www.linkedin.com/in/monami-jérôme-025038275/",
          "https://x.com/JeromeMonami",

        ],
        "worksFor": {

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Source+Sans+3:ital,wght@0,300;0,400;1,300&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/nexus.css" />

    <!-- icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link rel="manifest" href="manifest.json" />

    <script src="js/main.js" type="module"></script>

  <body>

    <div id="preloader" aria-hidden="true">
      <div class="preloader-content">
        <div class="preloader-logo"><span>M</span><span>J</span></div>
        <div class="preloader-bar">
          <div class="preloader-progress"></div>
        </div>
        <p class="preloader-text">Loading...</p>
      </div>
    </div>

    <!-- Scroll Progress Bar -->
    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

    <!-- Accessibility: skip to main content -->
    <a class="skip-link" href="#app">Skip to content</a>

    <!-- ── NAVBAR ───────────────────────────────── -->
    <nav id="navbar">
      <a href="#/" class="nav-logo" aria-label="Home">MJ</a>

      <!-- Language Switcher -->
      <div class="lang-switcher" id="langSwitcher"></div>

      <!-- Reader Mode Toggle -->
      <button
        class="reader-toggle"
        id="readerToggle"
        aria-label="Toggle reader mode"
      >
        <i class="bi bi-book"></i>
      </button>

      <button
        class="nav-burger"
        id="navBurger"
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="navLinks" role="list">
        <li><a href="#/" data-i18n="nav.home">Home</a></li>
        <li><a href="#/about" data-i18n="nav.about">About</a></li>
        <li><a href="#/projects" data-i18n="nav.projects">Projects</a></li>
        <li><a href="#/contact" data-i18n="nav.contact">Contact</a></li>
      </ul>

      <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="Toggle dark mode"
      >
        <i class="bi bi-moon-stars"></i>
      </button>
    </nav>

    <!-- ── SPA ROOT ─────────────────────────────── -->
    <main id="app" tabindex="-1"></main>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
      <i class="bi bi-arrow-up"></i>
    </button>

    <!-- ── FOOTER ───────────────────────────────── -->
    <footer id="footer">
      <p>© <span id="year"></span> Monami Jerome</p>
      <div class="footer-social">
        <a
          href="https://github.com/monamijer"
          aria-label="GitHub"
          target="_blank"
          rel="noopener"
        >
          <i class="bi bi-github"></i>
        </a>
        <a
          href="https://www.linkedin.com/in/monami-j%C3%A9r%C3%B4me-025038275/"
          aria-label="LinkedIn"
          target="_blank"
          rel="noopener"
        >
          <i class="bi bi-linkedin"></i>
        </a>
        <a
          href="https://x.com/JeromeMonami"
          aria-label="Twitter/X"
          target="_blank"
          rel="noopener"
        >
          <i class="bi bi-twitter-x"></i>
        </a>
        <a
          href="https://www.instagram.com/monamijerome"
          aria-label="instagram"
          target="_blank"
          rel="noopener"
        >
          <i class="bi bi-instagram"></i>
        </a>
      </div>
