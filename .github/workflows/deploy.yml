name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    # Only rebuild/redeploy when something that ends up in the site changes
    # (README, LICENSE and other docs-only commits no longer create a deployment)
    paths:
      - "css/**"
      - "js/**"
      - "public/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Monthly rebuild: the CV is generated at build time from the current date
    - cron: "0 3 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
